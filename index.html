<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>狐狸狩猎</title>
<style>
  :root {
    --bg: #1f2a1f;
    --panel: #2c3a2c;
    --text: #f1f5e9;
    --muted: #b7c4ac;
    --cell: #6b8f4e;
    --cell-alt: #648849;
    --line: #557a3f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 8px 32px;
  }
  h1 { margin: 4px 0 8px; font-size: 22px; }
  .hud { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .stat { background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 14px; min-width: 80px; text-align: center; }
  .stat b { font-size: 18px; }
  .stat.warn b { color: #ff8a80; }
  .hunters { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .hchip {
    background: var(--panel); border: 2px solid transparent; border-radius: 8px;
    padding: 4px 8px; font-size: 13px; cursor: pointer; color: var(--text);
  }
  .hchip.sel { border-color: #fff; }
  .hchip.down { opacity: .45; cursor: default; text-decoration: line-through; }
  .wrap { position: relative; width: min(94vw, 560px); }
  #board {
    display: grid; grid-template-columns: repeat(12, 1fr);
    width: 100%; aspect-ratio: 1;
    border: 3px solid #3e5a2e; border-radius: 6px; overflow: hidden;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .cell {
    position: relative; background: var(--cell); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: min(5.2vw, 28px); cursor: pointer; line-height: 1;
  }
  .cell.alt { background: var(--cell-alt); }
  .cell .tint { position: absolute; inset: 0; pointer-events: none; }
  .cell.reach::after {
    content: ""; position: absolute; inset: 2px; pointer-events: none;
    border: 2px dashed rgba(255, 255, 255, .6); border-radius: 3px;
  }
  .cell.sel { box-shadow: inset 0 0 0 3px #fff; }
  .cell .icon { position: relative; }
  .badge {
    position: absolute; top: 1px; right: 1px; width: 44%; height: 44%; border-radius: 50%;
    font-size: min(2.8vw, 14px); font-weight: bold; color: #111;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(0, 0, 0, .45);
  }
  .ammo, .tag {
    position: absolute; font-size: min(2.4vw, 11px); color: #fff;
    text-shadow: 0 0 2px #000, 0 0 2px #000;
  }
  .ammo { bottom: 1px; left: 2px; }
  .tag { top: 1px; left: 2px; }
  .faded { opacity: .55; }
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .arrow {
    position: absolute; left: 0; top: 0; width: 30px; height: 4px; margin: -2px 0 0 -15px;
    background: #8d5a2b; border-radius: 2px;
  }
  .arrow::after {
    content: ""; position: absolute; right: -8px; top: -4px;
    border-left: 10px solid #e0e0e0; border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .arrow::before {
    content: ""; position: absolute; left: -2px; top: -3px; width: 6px; height: 10px;
    background: #e53935; border-radius: 1px;
  }
  .pop {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
    font-weight: bold; font-size: 16px; white-space: nowrap;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
  .reveal { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); font-size: 30px; }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .55); border-radius: 6px;
  }
  #overlay.hidden { display: none; }
  .card {
    background: var(--panel); border-radius: 12px; padding: 18px 20px; max-width: 86%;
    text-align: center; box-shadow: 0 6px 24px rgba(0, 0, 0, .4);
  }
  .card h2 { margin: 0 0 8px; }
  .card p { margin: 6px 0; color: var(--muted); }
  button.main {
    margin-top: 10px; font-size: 16px; padding: 8px 20px; border: 0; border-radius: 8px;
    background: #f9a825; color: #222; font-weight: bold; cursor: pointer;
  }
  #msg { min-height: 22px; margin: 8px 0 4px; color: #ffe082; font-size: 15px; text-align: center; }
  .controls { margin-top: 4px; }
  .rules {
    width: min(94vw, 560px); background: var(--panel); border-radius: 8px;
    padding: 10px 14px; margin-top: 12px; font-size: 14px; color: var(--muted); line-height: 1.6;
  }
  .rules h3 { margin: 0 0 4px; color: var(--text); font-size: 15px; }
  .rules ul { margin: 0; padding-left: 18px; }
  .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin: 0 2px 0 6px; }
</style>
</head>
<body>
<h1>🦊 狐狸狩猎</h1>

<div class="hud">
  <div class="stat" id="statTime">⏱ 时间<br><b id="time">3:00</b></div>
  <div class="stat">🦊 抓到<br><b id="score">0</b></div>
  <div class="stat">🤠 猎人<br><b id="alive">5</b></div>
  <div class="stat">🔄 回合<br><b id="turn">0</b></div>
</div>
<div class="hunters" id="hunters"></div>

<div class="wrap">
  <div id="board"></div>
  <div id="fx"></div>
  <div id="overlay">
    <div class="card" id="card"></div>
  </div>
</div>

<div id="msg"></div>
<div class="controls"><button class="main" id="restart">重新开始</button></div>

<div class="rules">
  <h3>玩法</h3>
  <ul>
    <li>点一个猎人选中它，虚线框是它的九宫格。</li>
    <li><b>单击</b>九宫格里的格子 → 走一步；<b>双击</b> → 射一支箭。</li>
    <li>每走一步或射一箭，所有狐狸也会随机走一步。</li>
    <li>猎人头上的数字 = 九宫格里有几只狐狸：
      <span style="background:#4caf50"></span>0
      <span style="background:#fbc02d"></span>1
      <span style="background:#fb8c00"></span>2
      <span style="background:#e53935"></span>3+
    </li>
    <li>射中狐狸，它会现身并被抓住；射空就浪费一支箭。每个猎人开局 5 支箭。</li>
    <li>地图上藏着 4 个箭袋 🎁，踩到就 +3 支箭。</li>
    <li>狐狸走到猎人身上，或猎人走进狐狸的格子，猎人就被咬倒下。</li>
    <li>3 分钟内看你能抓到几只狐狸！</li>
  </ul>
</div>

<script>
(() => {
  const SIZE = 12;
  const FOX_COUNT = 10;
  const HUNTER_COUNT = 5;
  const START_ARROWS = 5;
  const TREASURE_COUNT = 4;
  const TREASURE_ARROWS = 3;
  const TIME_LIMIT = 180;
  const DBL_CLICK_MS = 280;
  const HUNTER_START_X = [1, 3, 6, 8, 10];
  const COLORS = ['76,175,80', '251,192,45', '251,140,0', '229,57,53'];

  const boardEl = document.getElementById('board');
  const fxEl = document.getElementById('fx');
  const overlayEl = document.getElementById('overlay');
  const cardEl = document.getElementById('card');
  const msgEl = document.getElementById('msg');
  const huntersEl = document.getElementById('hunters');

  let hunters, foxes, treasures, selId, score, turn, timeLeft, timer, state, busy, pending;

  const rand = n => Math.floor(Math.random() * n);
  const key = (x, y) => x + ',' + y;
  const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
  const inBounds = (x, y) => x >= 0 && y >= 0 && x < SIZE && y < SIZE;
  const aliveHunters = () => hunters.filter(h => h.alive);
  const hunterAt = (x, y) => hunters.find(h => h.alive && h.x === x && h.y === y);
  const foxAt = (x, y) => foxes.find(f => f.x === x && f.y === y);
  const selected = () => hunters.find(h => h.id === selId && h.alive);
  const countAround = h => foxes.filter(f => cheb(f, h) <= 1).length;
  const colorFor = n => COLORS[Math.min(n, 3)];
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function msg(text) { msgEl.textContent = text; }

  function newGame() {
    clearInterval(timer);
    clearPending();
    fxEl.innerHTML = '';
    overlayEl.onclick = null;
    hunters = HUNTER_START_X.slice(0, HUNTER_COUNT).map((x, i) => ({
      id: i + 1, x, y: SIZE - 1, arrows: START_ARROWS, alive: true,
    }));
    const taken = new Set(hunters.map(h => key(h.x, h.y)));
    // 狐狸不会一开始就出现在猎人的九宫格里
    foxes = [];
    while (foxes.length < FOX_COUNT) {
      const p = { x: rand(SIZE), y: rand(SIZE) };
      if (taken.has(key(p.x, p.y)) || hunters.some(h => cheb(h, p) <= 1)) continue;
      taken.add(key(p.x, p.y));
      foxes.push(p);
    }
    treasures = [];
    while (treasures.length < TREASURE_COUNT) {
      const p = { x: rand(SIZE), y: rand(SIZE - 2), found: false };
      if (taken.has(key(p.x, p.y))) continue;
      taken.add(key(p.x, p.y));
      treasures.push(p);
    }
    selId = 1;
    score = 0;
    turn = 0;
    timeLeft = TIME_LIMIT;
    busy = false;
    state = 'ready';
    msg('');
    render();
    showCard('🦊 狐狸狩猎',
      `<p>5 个猎人，10 只看不见的狐狸。</p>
       <p>单击走一步，双击射箭。</p>
       <p>3 分钟内能抓到几只？</p>`,
      '开始游戏', startGame);
  }

  function startGame() {
    hideCard();
    state = 'play';
    msg('选一个猎人，开始打猎吧！');
    timer = setInterval(() => {
      if (state !== 'play') return;
      timeLeft--;
      renderHud();
      if (timeLeft <= 0) endGame('⏰ 时间到！');
    }, 1000);
  }

  function showCard(title, html, btnText, onClick) {
    cardEl.innerHTML = `<h2>${title}</h2>${html}<button class="main">${btnText}</button>`;
    cardEl.querySelector('button').onclick = onClick;
    overlayEl.classList.remove('hidden');
  }
  function hideCard() { overlayEl.classList.add('hidden'); }

  // ---------- 渲染 ----------
  function renderHud() {
    const m = Math.floor(Math.max(timeLeft, 0) / 60);
    const s = String(Math.max(timeLeft, 0) % 60).padStart(2, '0');
    document.getElementById('time').textContent = `${m}:${s}`;
    document.getElementById('statTime').classList.toggle('warn', timeLeft <= 30);
    document.getElementById('score').textContent = score;
    document.getElementById('alive').textContent = aliveHunters().length;
    document.getElementById('turn').textContent = turn;
  }

  function render() {
    renderHud();
    const sel = selected();
    const over = state === 'over';

    // 每个格子的九宫格底色：选中的猎人优先
    const tint = new Map();
    const order = aliveHunters().filter(h => h !== sel);
    if (sel) order.push(sel);
    for (const h of order) {
      const c = colorFor(countAround(h));
      const alpha = h === sel ? 0.42 : 0.22;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (inBounds(h.x + dx, h.y + dy)) tint.set(key(h.x + dx, h.y + dy), `rgba(${c},${alpha})`);
      }
    }

    boardEl.innerHTML = '';
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + ((x + y) % 2 ? ' alt' : '');
      cell.dataset.x = x;
      cell.dataset.y = y;
      const t = tint.get(key(x, y));
      if (t) cell.innerHTML = `<div class="tint" style="background:${t}"></div>`;
      if (sel && !over && cheb(sel, { x, y }) === 1) cell.classList.add('reach');

      const h = hunterAt(x, y);
      const dead = hunters.find(d => !d.alive && d.x === x && d.y === y);
      if (h) {
        if (h === sel) cell.classList.add('sel');
        const n = countAround(h);
        cell.insertAdjacentHTML('beforeend',
          `<span class="icon">🤠</span>
           <span class="tag">${h.id}</span>
           <span class="badge" style="background:rgb(${colorFor(n)})">${n}</span>
           <span class="ammo">🏹${h.arrows}</span>`);
      } else if (over && foxAt(x, y)) {
        cell.insertAdjacentHTML('beforeend', '<span class="icon">🦊</span>');
      } else if (dead) {
        cell.insertAdjacentHTML('beforeend', `<span class="icon faded">💀</span><span class="tag">${dead.id}</span>`);
      } else if (over && treasures.some(t => !t.found && t.x === x && t.y === y)) {
        cell.insertAdjacentHTML('beforeend', '<span class="icon faded">🎁</span>');
      }
      boardEl.appendChild(cell);
    }

    huntersEl.innerHTML = '';
    for (const h of hunters) {
      const chip = document.createElement('div');
      chip.className = 'hchip' + (h.alive ? '' : ' down') + (h === sel ? ' sel' : '');
      chip.textContent = `🤠${h.id} ${h.alive ? '🏹' + h.arrows : '倒下'}`;
      if (h.alive) chip.onclick = () => {
        if (state !== 'play' || busy) return;
        clearPending();
        selId = h.id;
        render();
      };
      huntersEl.appendChild(chip);
    }
  }

  // ---------- 动画 ----------
  function cellCenter(x, y) {
    const w = boardEl.clientWidth / SIZE;
    const b = boardEl.clientLeft;
    return { x: b + (x + 0.5) * w, y: b + (y + 0.5) * w };
  }

  function popText(x, y, text, color) {
    const c = cellCenter(x, y);
    const el = document.createElement('div');
    el.className = 'pop';
    el.textContent = text;
    el.style.color = color;
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    fxEl.appendChild(el);
    el.animate([
      { transform: 'translate(-50%,-50%)', opacity: 1 },
      { transform: 'translate(-50%,-160%)', opacity: 0 },
    ], { duration: 1100, easing: 'ease-out' }).onfinish = () => el.remove();
  }

  function revealIcon(x, y, icon, duration = 800) {
    const c = cellCenter(x, y);
    const el = document.createElement('div');
    el.className = 'reveal';
    el.textContent = icon;
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    fxEl.appendChild(el);
    const anim = el.animate([
      { transform: 'translate(-50%,-50%) scale(.3)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(1.3)', opacity: 1, offset: 0.3 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: 0.7 },
      { transform: 'translate(-50%,-50%) scale(.8)', opacity: 0 },
    ], { duration, easing: 'ease-out' });
    return anim.finished.then(() => el.remove());
  }

  function flyArrow(from, to) {
    const a = cellCenter(from.x, from.y);
    const b = cellCenter(to.x, to.y);
    const angle = Math.atan2(b.y - a.y, b.x - a.x);
    const el = document.createElement('div');
    el.className = 'arrow';
    fxEl.appendChild(el);
    const anim = el.animate([
      { transform: `translate(${a.x}px,${a.y}px) rotate(${angle}rad)` },
      { transform: `translate(${b.x}px,${b.y}px) rotate(${angle}rad)` },
    ], { duration: 320, easing: 'ease-in', fill: 'forwards' });
    return anim.finished.then(() => el.remove());
  }

  // ---------- 操作 ----------
  function clearPending() {
    if (pending) clearTimeout(pending.timer);
    pending = null;
  }

  boardEl.addEventListener('click', e => {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    onCellClick(+cell.dataset.x, +cell.dataset.y);
  });
  boardEl.addEventListener('dblclick', e => e.preventDefault());

  function onCellClick(x, y) {
    if (state !== 'play' || busy) return;
    const h = hunterAt(x, y);
    const sel = selected();
    if (h && h !== sel) {
      clearPending();
      selId = h.id;
      render();
      return;
    }
    if (!sel) { msg('先点一个猎人'); return; }
    if (h === sel) return;
    if (cheb(sel, { x, y }) !== 1) { msg('只能在选中猎人的九宫格里行动'); return; }

    if (pending && pending.x === x && pending.y === y) {
      clearPending();
      shoot(sel, x, y);
      return;
    }
    clearPending();
    pending = { x, y, timer: setTimeout(() => { pending = null; move(sel, x, y); }, DBL_CLICK_MS) };
  }

  async function move(h, x, y) {
    if (state !== 'play' || busy || !h.alive) return;
    if (hunterAt(x, y)) { msg('那里已经有猎人了'); return; }
    busy = true;
    h.x = x;
    h.y = y;
    render();
    if (foxAt(x, y)) {
      h.alive = false;
      msg(`猎人${h.id} 走进了狐狸窝，被咬倒下！`);
      render();
      popText(x, y, '被咬！', '#ff5252');
      await revealIcon(x, y, '🦊');
    } else {
      const t = treasures.find(t => !t.found && t.x === x && t.y === y);
      if (t) {
        t.found = true;
        h.arrows += TREASURE_ARROWS;
        msg(`猎人${h.id} 找到了箭袋，+${TREASURE_ARROWS} 支箭！`);
        render();
        popText(x, y, `+${TREASURE_ARROWS} 🏹`, '#ffd54f');
        await revealIcon(x, y, '🎁');
      } else {
        msg('');
      }
    }
    await endTurn();
  }

  async function shoot(h, x, y) {
    if (state !== 'play' || busy || !h.alive) return;
    if (h.arrows <= 0) { msg(`猎人${h.id} 没有箭了，只能移动`); return; }
    if (hunterAt(x, y)) { msg('不能射自己人！'); return; }
    busy = true;
    h.arrows--;
    render();
    await flyArrow(h, { x, y });
    const fox = foxAt(x, y);
    if (fox) {
      foxes.splice(foxes.indexOf(fox), 1);
      score++;
      msg(`射中了！猎人${h.id} 抓到一只狐狸 🦊`);
      render();
      popText(x, y, '+1 🦊', '#b9f6ca');
      await revealIcon(x, y, '🦊', 900);
    } else {
      msg(`没射中，浪费了一支箭（猎人${h.id} 还剩 ${h.arrows} 支）`);
      popText(x, y, '落空', '#e0e0e0');
      await sleep(250);
    }
    await endTurn();
  }

  function moveFoxes() {
    const bites = [];
    const occ = new Set(foxes.map(f => key(f.x, f.y)));
    for (const f of foxes) {
      occ.delete(key(f.x, f.y));
      const opts = [];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = f.x + dx, ny = f.y + dy;
        if (inBounds(nx, ny) && !occ.has(key(nx, ny))) opts.push([nx, ny]);
      }
      const [nx, ny] = opts[rand(opts.length)];
      f.x = nx;
      f.y = ny;
      occ.add(key(nx, ny));
      const h = hunterAt(nx, ny);
      if (h) {
        h.alive = false;
        bites.push(h);
      }
    }
    return bites;
  }

  async function endTurn() {
    if (state !== 'play') { busy = false; return; }
    turn++;
    const bites = moveFoxes();
    if (!selected()) {
      const next = aliveHunters()[0];
      selId = next ? next.id : null;
    }
    render();
    if (bites.length) {
      msg(bites.map(h => `猎人${h.id}`).join('、') + ' 被狐狸咬倒了！');
      for (const h of bites) popText(h.x, h.y, '被咬！', '#ff5252');
      await Promise.all(bites.map(h => revealIcon(h.x, h.y, '🦊')));
    }
    busy = false;
    checkEnd();
  }

  function checkEnd() {
    if (state !== 'play') return;
    if (foxes.length === 0) return endGame('🎉 所有狐狸都抓到了！');
    if (aliveHunters().length === 0) return endGame('💀 猎人全部倒下了');
    const noArrows = aliveHunters().every(h => h.arrows === 0);
    const noTreasure = treasures.every(t => t.found);
    if (noArrows && noTreasure) return endGame('🏹 箭都用完了');
  }

  function endGame(reason) {
    state = 'over';
    clearInterval(timer);
    clearPending();
    render();
    msg(reason);
    const used = TIME_LIMIT - Math.max(timeLeft, 0);
    showCard(reason,
      `<p>抓到狐狸：<b style="color:#fff;font-size:22px">${score}</b> 只</p>
       <p>剩余猎人：${aliveHunters().length} ／ 回合：${turn} ／ 用时：${used} 秒</p>
       <p>地图上已亮出剩下的狐狸 🦊 和箭袋 🎁</p>`,
      '再玩一次', newGame);
    // 让玩家能看到亮出的地图：点卡片外面可以关闭
    overlayEl.onclick = e => { if (e.target === overlayEl) hideCard(); };
  }

  document.getElementById('restart').onclick = newGame;
  window.addEventListener('resize', () => { fxEl.innerHTML = ''; });

  newGame();
})();
</script>
</body>
</html>
